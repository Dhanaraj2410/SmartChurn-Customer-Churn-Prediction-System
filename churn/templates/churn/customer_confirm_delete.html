{% extends 'churn/base.html' %}

{% block title %}Delete Customer | SmartChurn AI{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-8 fade-in">
    <div class="glass-panel rounded-2xl p-8 border-t-4 border-red-500 shadow-xl text-center space-y-6">
        <div class="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center text-3xl mx-auto shadow-inner">
            <i class="fas fa-exclamation-triangle"></i>
        </div>

        <div>
            <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Delete Customer Profile</h1>
            <p class="text-xs text-gray-500 mt-2">
                Are you sure you want to delete customer <strong class="text-red-500">{{ customer.customer_id }}</strong>? This action cannot be undone.
            </p>
        </div>

        <form method="post" class="flex justify-center space-x-3">
            {% csrf_token %}
            <a href="{% url 'customers' %}" class="px-5 py-2.5 bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 font-bold rounded-xl text-sm hover:bg-gray-300">Cancel</a>
            <button type="submit" class="px-6 py-2.5 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl text-sm shadow-md transition-all">Confirm Delete</button>
        </form>
    </div>
</div>
{% endblock %}
